<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caso — Archivo Criminológico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="grain"></div><header class="site-header"><a class="brand" href="index.html"><span>AC</span> ARCHIVO CRIMINOLÓGICO</a><button class="menu-toggle">☰</button><nav><a href="index.html">Inicio</a><a class="active" href="casos.html">Casos</a><a href="comparativa.html">Comparativa</a><a href="conceptos.html">Conceptos</a></nav></header>
<main class="page"><section class="page-hero" id="caseHero"></section><section class="section" id="caseContent"></section></main>
<footer><span>ARCHIVO CRIMINOLÓGICO</span><span>Proyecto académico · 2026</span></footer>
<script src="js/data.js"></script>
<script>
const id=new URLSearchParams(location.search).get("id")||"kemper";
const c=cases.find(x=>x.id===id)||cases[0], d=details[id]||{};
document.title=c.name+" — Archivo Criminológico";
document.querySelector("#caseHero").innerHTML=`
<div class="section-label">EXPEDIENTE / ${String(cases.indexOf(c)+1).padStart(2,"0")}</div>
<h1>${c.name}<br><em>${c.alias}</em></h1>
<p>${c.place} · ${c.period}</p>
<div class="tags">${c.tags.map(t=>`<span>${t}</span>`).join("")}</div>`;
document.querySelector("#caseContent").innerHTML=`
<div class="intro-grid" style="margin-top:0">
<div><div class="section-label">FICHA</div><h2>${c.accent}</h2></div>
<div class="intro-text"><p><strong>Víctimas:</strong> ${c.victims}</p><p><strong>Condena / estado:</strong> ${c.sentence}</p></div>
</div>
<div class="detail-grid" style="margin-top:80px;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#292929">
${[
["Infancia y adolescencia",d.child],["Desarrollo / carrera criminal",d.career],["Victimología",d.victimology],["Modus operandi",d.mo],["Perfil criminológico",d.profile],["Teorías",d.theories]
].map(x=>`<article class="concept-card"><span>ANÁLISIS</span><h3>${x[0]}</h3><p>${x[1]||"Contenido pendiente de ampliar a partir del material de estudio."}</p></article>`).join("")}
</div>
<div style="margin-top:55px"><a class="text-link" href="casos.html">← Volver a casos</a></div>`;
</script>
</body></html>
